<!doctype html>
<html lang="en" data-host="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Saathi</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, "Noto Sans Devanagari", sans-serif;
        background: #f7f5f0;
        color: #1d1b18;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main { max-width: 32ch; text-align: center; }
      .tile {
        width: 48px; height: 48px; margin: 0 auto 16px;
        border-radius: 12px; background: #b0532a; color: #fffcf8;
        display: grid; place-items: center; font-size: 22px; font-weight: 600;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 10px; line-height: 1.5; color: #5c534a; }
      button {
        min-height: 48px; margin-top: 12px; padding: 0 20px;
        border: 0; border-radius: 999px; background: #b0532a; color: #fff;
        font-size: 16px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden>स</div>
      <h1>Couldn't load. Your WhatsApp updates still work.</h1>
      <p lang="hi">पेज नहीं खुला। व्हाट्सऐप अपडेट चलते रहेंगे।</p>
      <p>Check the connection, then try again.</p>
      <button type="button" id="retry">Retry · फिर कोशिश</button>
    </main>
    <script>
      document.getElementById("retry").onclick = function () {
        var host = document.documentElement.getAttribute("data-host") || "";
        var raw = decodeURIComponent((location.hash || "").replace(/^#/, ""));
        if (!raw && host) raw = "https://" + host + "/";
        try {
          var url = new URL(raw);
          var loopback = url.hostname === "10.0.2.2" || url.hostname === "localhost" || url.hostname === "127.0.0.1";
          var okHost = host && url.hostname.toLowerCase() === host.toLowerCase();
          var okHttps = url.protocol === "https:";
          var okHttp = url.protocol === "http:" && loopback;
          if (okHost && (okHttps || okHttp)) location.href = url.toString();
        } catch (e) {}
      };
    </script>
  </body>
</html>
